name: V0.4 Targeted Validation

on:
  pull_request:

jobs:
  validate-v04:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore PerformanceAgent.sln
      - run: dotnet build PerformanceAgent.sln --configuration Release --no-restore
      - run: dotnet test tests/unit/PerformanceAgent.BenchmarkDotNet.Tests/PerformanceAgent.BenchmarkDotNet.Tests.csproj --configuration Release --no-build
      - name: Validate healthy benchmark project
        shell: pwsh
        run: |
          $output = dotnet run --project apps/cli/PerformanceAgent.Cli --configuration Release --no-build -- validate samples/run/PerformanceAgent.SampleBenchmarks.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $output -join "`n"
          if ($text -notmatch "Validation: VALID") { throw "Expected VALID benchmark output. Output: $text" }
          if ($text -notmatch "Benchmark types: 1") { throw "Expected one benchmark type. Output: $text" }
      - name: Reject invalid benchmark declaration
        shell: pwsh
        run: |
          $output = dotnet run --project apps/cli/PerformanceAgent.Cli --configuration Release --no-build -- validate tests/fixtures/InvalidBenchmarks/InvalidBenchmarks.csproj 2>&1
          if ($LASTEXITCODE -ne 1) { throw "Expected INVALID exit code 1, got $LASTEXITCODE. Output: $output" }
          $text = $output -join "`n"
          if ($text -notmatch "Validation: INVALID") { throw "Expected INVALID output. Output: $text" }
          if ($text -notmatch "Method must be public") { throw "Expected BenchmarkDotNet declaration diagnostic. Output: $text" }
          exit 0
      - name: Distinguish build failures from invalid benchmarks
        shell: pwsh
        run: |
          $output = dotnet run --project apps/cli/PerformanceAgent.Cli --configuration Release --no-build -- validate tests/fixtures/BrokenBenchmarks/BrokenBenchmarks.csproj 2>&1
          if ($LASTEXITCODE -ne 2) { throw "Expected command-error exit code 2, got $LASTEXITCODE. Output: $output" }
          $text = $output -join "`n"
          if ($text -notmatch "error CS") { throw "Expected compiler diagnostic. Output: $text" }
          exit 0
