name: Performance Gate Demo

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build perfagent
        run: dotnet build PerformanceAgent.sln --configuration Release
      - name: Check candidate against baseline
        run: >
          dotnet run --project apps/cli/PerformanceAgent.Cli
          --configuration Release --no-build --
          check samples/ci/baseline.json samples/ci/candidate.json
          --budget samples/ci/performance-budget.json
