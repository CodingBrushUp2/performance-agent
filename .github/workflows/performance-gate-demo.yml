name: Performance Gate Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  performance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Build perfagent
        run: dotnet build apps/cli/PerformanceAgent.Cli/PerformanceAgent.Cli.csproj --configuration Release
      - name: Check candidate against baseline
        run: >
          dotnet run --project apps/cli/PerformanceAgent.Cli
          --configuration Release --no-build --
          check samples/ci/baseline.json samples/ci/candidate.json
          --budget samples/ci/performance-budget.json
