name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore PerformanceAgent.sln
      - run: dotnet build PerformanceAgent.sln --configuration Release --no-restore
      # Keep projects isolated in this PR so a benchmark-process failure is attributed precisely.
      - name: Test Core
        timeout-minutes: 5
        run: dotnet test tests/unit/PerformanceAgent.Core.Tests/PerformanceAgent.Core.Tests.csproj --configuration Release --no-build
      - name: Test AI
        timeout-minutes: 5
        run: dotnet test tests/unit/PerformanceAgent.AI.Tests/PerformanceAgent.AI.Tests.csproj --configuration Release --no-build
      - name: Test BenchmarkDotNet integration
        timeout-minutes: 5
        run: dotnet test tests/integration/PerformanceAgent.BenchmarkDotNet.IntegrationTests/PerformanceAgent.BenchmarkDotNet.IntegrationTests.csproj --configuration Release --no-build
      - name: Test CLI integration
        timeout-minutes: 5
        run: dotnet test tests/integration/PerformanceAgent.Cli.IntegrationTests/PerformanceAgent.Cli.IntegrationTests.csproj --configuration Release --no-build --blame-hang-timeout 30s --blame-hang-dump-type none
      - run: bash tests/e2e/cli-smoke.sh
      - run: bash tests/e2e/history-smoke.sh
      - run: bash tests/e2e/discovery-smoke.sh
      - run: python3 tests/e2e/cancellation-smoke.py
      - run: python3 tests/e2e/ui-smoke.py
      - name: Pack and smoke-test dotnet tool
        run: |
          dotnet pack apps/cli/PerformanceAgent.Cli/PerformanceAgent.Cli.csproj --configuration Release --no-build --output artifacts
          dotnet tool install --tool-path ./.tools PerformanceAgent.Cli --version 0.2.0 --add-source ./artifacts
          ./.tools/perfagent --help | grep -F "Commands:"
          ./.tools/perfagent check --help | grep -F "The candidate is an evidence JSON file."
          ./.tools/perfagent compare ToolSmoke 100 90 1000 900 markdown | grep -F "| ToolSmoke | Mean (ns) | 100 | 90 | -10% | Comparable |"
      - name: Run installed tool outside the source tree
        timeout-minutes: 10
        run: bash tests/e2e/installed-tool-smoke.sh
